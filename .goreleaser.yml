# .goreleaser.yml
# Visit https://goreleaser.com/customization/ for more options
version: 2

release:
  prerelease: auto

builds:
  - id: lifecycle-controller
    main: ./cmd/main.go
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: lifecycle-controller-archives
    builds:
      - lifecycle-controller
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - LICENSE
      - README.md

dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:{{ .Version }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--platform=linux/arm64"
    use: buildx
    goos: linux
    goarch: amd64
    ids:
      - lifecycle-controller

checksum:
  name_template: "checksums.txt"
