name: Cache CI dependencies

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'charts/lifecycle-controller/.Version'
      - 'hack/install-kind.sh'
      - '.github/workflows/cache-dependencies.yml'
  workflow_dispatch:

permissions: {}

env:
  KIND_VERSION: v0.32.0
  HELM_CHART_PATH: charts/lifecycle-controller
  HELM_UNITTEST_VERSION: v1.1.1

jobs:
  cache:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    name: Cache Go tools, kind, and Helm plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache Go tools and envtest assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bin
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}

      - name: Download Go modules
        run: go mod download

      - name: Build Go tools and envtest assets
        run: make kustomize controller-gen setup-envtest

      - name: Read Helm version from .Version
        id: get-helm-version
        run: echo "version=$(head "$HELM_CHART_PATH/.Version")" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - name: Cache Helm unittest plugin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/helm/plugins/helm-unittest
          key: helm-plugin-${{ runner.os }}-${{ runner.arch }}-${{ steps.get-helm-version.outputs.version }}-${{ env.HELM_UNITTEST_VERSION }}

      - name: Install Helm unittest plugin
        run: |
          if [ ! -d "$(helm env HELM_PLUGINS)/helm-unittest" ]; then
            helm plugin install https://github.com/helm-unittest/helm-unittest \
              --version "$HELM_UNITTEST_VERSION" --verify=false
          fi

      - name: Cache kind
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kind
          key: kind-${{ runner.os }}-${{ runner.arch }}-${{ env.KIND_VERSION }}

      - name: Install kind
        run: hack/install-kind.sh
