name: Helm Unit Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'Makefile'
      - '.github/workflows/test-helm-unittest.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'Makefile'
      - '.github/workflows/test-helm-unittest.yml'

permissions: {}

env:
  HELM_CHART_PATH: charts/lifecycle-controller
  HELM_UNITTEST_VERSION: v1.1.1

jobs:
  helm-unittest:
    permissions:
      contents: read
    name: Helm unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Helm version from .Version
        id: get-helm-version
        run: |
          echo "version=$(head ${{ env.HELM_CHART_PATH }}/.Version)" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - run: helm version

      - name: Install helm-unittest plugin
        run: |
          if [ ! -d "$(helm env HELM_PLUGINS)/helm-unittest" ]; then
            helm plugin install https://github.com/helm-unittest/helm-unittest \
              --version "$HELM_UNITTEST_VERSION" --verify=false
          fi

      - name: Run Helm unit tests
        run: make helm-unittest HELM_CHART_PATH=${{ env.HELM_CHART_PATH }}
