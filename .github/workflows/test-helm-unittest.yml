name: Helm Unit Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-helm-unittest.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-helm-unittest.yml'

permissions: {}

env:
  HELM_CHART_PATH: charts/lifecycle-controller
  HELM_UNITTEST_VERSION: v1.1.1

jobs:
  helm-unittest:
    permissions:
      contents: read
    name: Helm unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Restore Go modules and build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Read Helm version from .Version
        id: get-helm-version
        run: |
          echo "version=$(head ${{ env.HELM_CHART_PATH }}/.Version)" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - run: helm version

      - name: Cache Helm unittest plugin
        if: github.event_name == 'push'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/helm/plugins/helm-unittest
          key: helm-plugin-${{ runner.os }}-${{ runner.arch }}-${{ steps.get-helm-version.outputs.version }}-${{ env.HELM_UNITTEST_VERSION }}

      - name: Restore Helm unittest plugin
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/helm/plugins/helm-unittest
          key: helm-plugin-${{ runner.os }}-${{ runner.arch }}-${{ steps.get-helm-version.outputs.version }}-${{ env.HELM_UNITTEST_VERSION }}

      - name: Install helm-unittest plugin
        run: |
          if [ ! -d "$(helm env HELM_PLUGINS)/helm-unittest" ]; then
            helm plugin install https://github.com/helm-unittest/helm-unittest \
              --version "$HELM_UNITTEST_VERSION" --verify=false
          fi

      - name: Run Helm unit tests
        run: make helm-unittest HELM_CHART_PATH=${{ env.HELM_CHART_PATH }}
