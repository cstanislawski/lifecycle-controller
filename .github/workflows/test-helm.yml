name: Test Helm Chart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'Makefile'
      - '.github/workflows/test-helm.yml'

env:
  HELM_CHART_PATH: charts/lifecycle-controller

jobs:
  template-test:
    name: Template Render
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get helm version from file
        id: get-helm-version
        run: |
          echo "version=$(head ${{ env.HELM_CHART_PATH }}/.Version)" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - name: Running Helm Template Validation
        run: make helm-template HELM_CHART_PATH=${{ env.HELM_CHART_PATH }}
