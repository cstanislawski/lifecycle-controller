name: Lint Helm Chart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'Makefile'
      - '.github/workflows/lint-helm.yml'

env:
  HELM_CHART_PATH: charts/lifecycle-controller

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Get helm version from file
        id: get-helm-version
        run: |
          echo "version=$(head ${{ env.HELM_CHART_PATH }}/.Version)" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - name: Running Helm Lint
        run: make helm-lint HELM_CHART_PATH=${{ env.HELM_CHART_PATH }}
