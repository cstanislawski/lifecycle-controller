name: Helm E2E Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '**.go'
      - 'charts/**'
      - 'test/e2e-helm/**'
      - 'test/utils/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'hack/boilerplate.go.txt'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-e2e-helm.yml'
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'charts/**'
      - 'test/e2e-helm/**'
      - 'test/utils/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'hack/boilerplate.go.txt'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-e2e-helm.yml'

permissions: {}

env:
  HELM_CHART_PATH: charts/lifecycle-controller
  KIND_VERSION: v0.32.0

jobs:
  test-e2e-helm:
    permissions:
      contents: read
    name: Helm E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod

      - run: go version

      - name: Read Helm version from .Version
        id: get-helm-version
        run: |
          echo "version=$(head ${{ env.HELM_CHART_PATH }}/.Version)" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - run: helm version

      - name: Set up kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}

      - name: Prepare image inputs
        run: make generate fmt

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: default-load=true

      - name: Build controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          pull: true
          tags: lifecycle-controller-helm-e2e:v0.0.1
          cache-from: type=gha,scope=helm-e2e
          cache-to: type=gha,scope=helm-e2e,mode=max,ignore-error=true

      - name: Run Helm E2E tests
        env:
          # Reuse the cache for the suite's make docker-build calls.
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          make test-e2e-helm
