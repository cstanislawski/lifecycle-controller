name: Helm E2E Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'test/e2e-helm/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-e2e-helm.yml'

permissions: {}

env:
  HELM_CHART_PATH: charts/lifecycle-controller
  KIND_VERSION: v0.32.0

jobs:
  test-e2e-helm:
    permissions:
      contents: read
    name: Helm E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod

      - run: go version

      - name: Read Helm version from .Version
        id: get-helm-version
        run: |
          echo "version=$(head ${{ env.HELM_CHART_PATH }}/.Version)" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ steps.get-helm-version.outputs.version }}

      - run: helm version

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}

      - name: Run Helm E2E tests
        run: |
          make test-e2e-helm
