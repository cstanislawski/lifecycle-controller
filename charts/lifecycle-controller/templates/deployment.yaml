apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lifecycle-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lifecycle-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lifecycle-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lifecycle-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lifecycle-controller.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address={{ .Values.controllerManager.healthProbeBindAddress }}
            {{- if .Values.controllerManager.leaderElection.enabled }}
            - --leader-elect
            {{- $leaderElectionID := .Values.controllerManager.leaderElection.resourceName | default (include "lifecycle-controller.fullname" .) }}
            - --leader-election-id={{ $leaderElectionID }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- if .Values.controllerManager.enableHTTP2 }}
            - --enable-http2
            {{- end }}
            - --dry-run={{ .Values.controllerManager.dryRun }}
            {{- if .Values.controllerManager.maxDeleteTTL }}
            - --max-delete-ttl={{ .Values.controllerManager.maxDeleteTTL }}
            {{- end }}
            - --zap-log-level={{ .Values.controllerManager.logLevel }}
            {{- range .Values.controllerManager.scope.watchResources }}
            - --watch-resource={{ . }}
            {{- end }}
            {{- range .Values.controllerManager.scope.ignoreResources }}
            - --ignore-resource={{ . }}
            {{- end }}
            {{- range .Values.controllerManager.scope.watchNamespaces }}
            - --watch-namespace={{ . }}
            {{- end }}
            {{- range .Values.controllerManager.scope.ignoreNamespaces }}
            - --ignore-namespace={{ . }}
            {{- end }}
          ports:
          - containerPort: 8081
            name: healthz
            protocol: TCP
          {{- if .Values.metrics.enabled }}
          - containerPort: {{ trimPrefix ":" .Values.metrics.bindAddress }}
            name: metrics
            protocol: TCP
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
