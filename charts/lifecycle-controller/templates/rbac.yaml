{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lifecycle-controller.fullname" . }}-manager-role
  labels:
    {{- include "lifecycle-controller.labels" . | nindent 4 }}
rules:
{{- if .Values.controllerManager.scope.watchResources }}
  {{- range .Values.controllerManager.scope.watchResources }}
  {{- $parts := splitList "." . }}
  {{- $res := index $parts 0 }}
  {{- if eq $res "" }}
    {{- fail (printf "invalid controllerManager.scope.watchResources entry %q: resource segment cannot be empty" .) }}
  {{- end }}
  {{- $grp := "" }}
  {{- if gt (len $parts) 1 }}
    {{- $rest := rest $parts }}
    {{- if has "" $rest }}
      {{- fail (printf "invalid controllerManager.scope.watchResources entry %q: apiGroup segments cannot be empty" .) }}
    {{- end }}
    {{- $grp = join "." $rest }}
  {{- end }}
- apiGroups: ["{{ $grp }}"]
  resources: ["{{ $res }}"]
  verbs: ["delete", "get", "list", "patch", "update", "watch"]
  {{- end }}
{{- else }}
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["delete", "get", "list", "patch", "update", "watch"]
{{- end }}
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lifecycle-controller.fullname" . }}-manager-rolebinding
  labels:
    {{- include "lifecycle-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lifecycle-controller.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "lifecycle-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Permissions for leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lifecycle-controller.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lifecycle-controller.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lifecycle-controller.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lifecycle-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lifecycle-controller.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "lifecycle-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end -}}
