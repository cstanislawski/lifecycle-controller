{{- if .Values.rbac.create -}}
{{- $root := . -}}
{{- $namespaced := eq (include "lifecycle-controller.rbacScope" .) "namespaced" -}}
{{- $namespaces := list "" -}}
{{- if $namespaced -}}
  {{- $namespaces = include "lifecycle-controller.rbacNamespaces" . | fromJsonArray -}}
{{- end -}}
{{- range $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $namespaced }}
metadata:
  name: {{ include "lifecycle-controller.fullname" $root }}-manager-role
  {{- if $namespaced }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "lifecycle-controller.labels" $root | nindent 4 }}
rules:
  {{- include "lifecycle-controller.resourceRules" $root | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $namespaced }}
metadata:
  name: {{ include "lifecycle-controller.fullname" $root }}-manager-rolebinding
  {{- if $namespaced }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "lifecycle-controller.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $namespaced }}
  name: {{ include "lifecycle-controller.fullname" $root }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "lifecycle-controller.serviceAccountName" $root }}
  namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end -}}
