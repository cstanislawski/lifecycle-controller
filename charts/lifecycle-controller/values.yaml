replicaCount: 1

image:
  repository: ghcr.io/cstanislawski/lifecycle-controller
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Create the necessary ClusterRole, ClusterRoleBinding, Role, and RoleBinding
rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Controller-specific command line arguments
controllerManager:
  leaderElection:
    enabled: true
    resourceName: ""
  healthProbeBindAddress: ":8081"
  # enableHTTP2 can be set to true if needed, but defaults to false for security.
  enableHTTP2: false

  # Enable global dry-run mode (logs actions without executing them)
  dryRun: false

  # Log level for the controller (debug, info, error)
  logLevel: info

  # Scoping Configuration
  # Defines which resources and namespaces the controller should watch.
  scope:
    # List of glob patterns for resources to watch.
    # The default is intentionally limited so the generated RBAC avoids wildcard production access.
    # Set to ["*", "*.*"] and clear ignoreResources only when cluster-wide access is intended.
    watchResources:
      - deployments.apps
      - statefulsets.apps
      - daemonsets.apps
      - jobs.batch
      - cronjobs.batch
    # List of glob patterns for resources to ignore. These protected resources are excluded by default.
    ignoreResources:
      - secrets
      - serviceaccounts
      - roles.rbac.authorization.k8s.io
      - rolebindings.rbac.authorization.k8s.io
      - clusterroles.rbac.authorization.k8s.io
      - clusterrolebindings.rbac.authorization.k8s.io
      - nodes
      - persistentvolumes
      - storageclasses.storage.k8s.io
      - customresourcedefinitions.apiextensions.k8s.io
    # List of glob patterns for namespaces to watch (e.g. ["default", "dev-*"])
    watchNamespaces: []
    # List of glob patterns for namespaces to ignore
    ignoreNamespaces: []

metrics:
  # Enable the metrics endpoint
  enabled: true
  bindAddress: ":8443"
  secure: true # Corresponds to --metrics-secure flag
  service:
    # enable the metrics service
    enabled: true
    type: ClusterIP
    port: 8443
    annotations: {}
      # prometheus.io/scrape: "true"
      # prometheus.io/port: "8443"
  serviceMonitor:
    # If true, a ServiceMonitor CR will be created
    enabled: false
    # namespace where ServiceMonitor resource should be installed
    namespace: ""
    # additional labels for the ServiceMonitor
    additionalLabels: {}
    insecureSkipVerify: true

nodeSelector: {}
tolerations: []
affinity: {}
