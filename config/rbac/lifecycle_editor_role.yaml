# This rule is not used by the project lifecycle-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the lifecycle.cezary.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: lifecycle-controller
    app.kubernetes.io/managed-by: kustomize
  name: lifecycle-editor-role
rules:
- apiGroups:
  - lifecycle.cezary.dev
  resources:
  - lifecycles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lifecycle.cezary.dev
  resources:
  - lifecycles/status
  verbs:
  - get
